name: Integration tests Helm

concurrency:
  group: integration-tests-helm-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize
    branches:
      - main
      - stable-*

permissions: {}

jobs:
  splitter:
    env:
      source_dir: "./source"
    runs-on: ubuntu-latest
    outputs:
      helm_targets: ${{ steps.select-targets.outputs.targets }}
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Checkout the collection repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.source_dir }}
          fetch-depth: "0"
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: list changes for pull request
        id: splitter
        uses: ansible-network/github_actions/.github/actions/ansible_test_splitter@4678c74a7d712d55e663c88f66eec6d9c3642550
        with:
          collections_to_test: ${{ env.source_dir }}
          total_jobs: 8

      - name: Select Helm targets
        id: select-targets
        run: |
          import os, json
          with open(os.environ.get('GITHUB_OUTPUT'), "a", encoding="utf-8") as fh:
            data = os.environ.get("ALL_TEST_TARGETS")
            targets = []
            for target in data.split(";"):
              if target and ':' in target:
                targets.extend([v for v in target.split(':', maxsplit=1)[1].split(',') if v.startswith('helm')])
            fh.write(f'targets={json.dumps(targets)}\n')
        shell: python
        env:
          ALL_TEST_TARGETS: ${{ steps.splitter.outputs.test_targets }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - splitter
    if: ${{ needs.splitter.outputs.helm_targets != '' && needs.splitter.outputs.helm_targets != '[]' }}
    env:
      source: "./source"
      ansible_posix: "./ansible_posix"
      community_general: "./community_general"
      ansible-version: "milestone"
      python-version: "3.13"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.0.0
          - v3.1.0
          - v3.8.0
          - v3.10.3
          - v3.15.4
          - v3.16.0
          - v3.17.0
          - v4.0.0
          - v4.2.1
          - latest
        ansible_test_target: ${{ fromJson(needs.splitter.outputs.helm_targets) }}
        exclude:
          # helm_registry_auth: only test against recent versions to reduce CI cost
          - ansible_test_target: "helm_registry_auth"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm_registry_auth"
            helm-version: "v3.1.0"
          - ansible_test_target: "helm_registry_auth"
            helm-version: "v3.8.0"
          - ansible_test_target: "helm_registry_auth"
            helm-version: "v3.10.3"
          - ansible_test_target: "helm_registry_auth"
            helm-version: "v3.15.4"
          - ansible_test_target: "helm_registry_auth"
            helm-version: "v3.16.0"
          # helm install/upgrade --create-namespace requires helm >= 3.2.0
          - ansible_test_target: "helm_diff"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm_diff"
            helm-version: "v3.1.0"
          - ansible_test_target: "helm_diff"
            helm-version: "v3.8.0"
          - ansible_test_target: "helm_diff"
            helm-version: "v3.10.3"
          # UPGRADE FAILED: conflict occurred while applying object helm-diff/test-chart-another-configmap /v1
          - ansible_test_target: "helm_diff"
            helm-version: "v4.0.0"
          - ansible_test_target: "helm_repository"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm_repository"
            helm-version: "v3.1.0"
          - ansible_test_target: "helm_kubeconfig"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm_kubeconfig"
            helm-version: "v3.1.0"
          - ansible_test_target: "helm_set_values"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm_set_values"
            helm-version: "v3.1.0"
          - ansible_test_target: "helm_set_values"
            helm-version: "v3.8.0"
          - ansible_test_target: "helm"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm"
            helm-version: "v3.1.0"
          - ansible_test_target: "helm_uninstall"
            helm-version: "v3.0.0"
          - ansible_test_target: "helm_uninstall"
            helm-version: "v3.1.0"
    name: "${{ matrix.ansible_test_target }}-${{ matrix.helm-version }}"
    steps:
      - name: Checkout kubernetes.core repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.source }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python ${{ env.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.python-version }}

      # install ansible
      - name: Install ansible-core (${{ env.ansible-version }})
        env:
          ANSIBLE_VERSION: ${{ env.ansible-version }}
        run: |
          curl -sSL --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github.com/ansible/ansible/archive/${ANSIBLE_VERSION}.tar.gz" \
            -o ansible.tar.gz
          python3 -m pip install ./ansible.tar.gz --disable-pip-version-check
          rm ansible.tar.gz
        shell: bash

      - name: Build and install collection
        id: install-src
        uses: ansible-network/github_actions/.github/actions/build_install_collection@4678c74a7d712d55e663c88f66eec6d9c3642550
        with:
          install_python_dependencies: true
          source_path: ${{ env.source }}

      - name: create kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: "kindest/node:v1.29.2"

      - name: "Install Helm version ${{ matrix.helm-version }}"
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '${{ matrix.helm-version }}'

      - name: Verify Helm Installation
        run: helm version

      - name: Disable selinux with selinux_please_lie_to_me
        run: |
          python3 -m pip uninstall -y selinux
          python3 -m pip install selinux_please_lie_to_me
        shell: bash

      - name: Install python requirements
        run: python3 -m pip install -r test-requirements.txt -r requirements.txt
        shell: bash
        working-directory: ${{ steps.install-src.outputs.collection_path }}

      - name: Run integration tests
        run: >-
          ansible-test integration
          --diff
          --no-temp-workdir
          --color
          --skip-tags False
          --retry-on-error
          --continue-on-error
          --python ${{ env.python-version }}
          -v
          ${{ matrix.ansible_test_target }}
        shell: bash
        working-directory: ${{ steps.install-src.outputs.collection_path }}
