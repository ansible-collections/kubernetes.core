apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-job
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: test
          image: "busybox"
          command: ["sh", "-c", "echo done"]
          resources:
            limits:
              memory: "64Mi"
